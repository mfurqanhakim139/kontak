# Ganti 'nama_proyek_anda' dengan nama proyek Flutter Anda yg sebenarnya
name: kontak_chat_app
description: Sebuah aplikasi chat demo dengan sinkronisasi kontak.

# Mencegah publikasi tidak sengaja ke pub.dev
publish_to: 'none'

# Versi aplikasi Anda
version: 1.0.0+1

# --- ENVIRONMENT (SDK Constraint) - POSISI YANG BENAR ---
# Sejajar dengan name, description, version, dependencies
environment:
  # Tentukan versi Dart SDK yang kompatibel
  sdk: '^3.7.0'
# ------------------------------------------------------

# --- DEPENDENCIES - POSISI YANG BENAR ---
dependencies:
  flutter:
    sdk: flutter

  # Dependensi yang Anda tambahkan:
  contacts_service: ^0.6.3    # Untuk membaca kontak
  permission_handler: ^12.0.0+1 # Untuk mengelola izin
  http: ^1.1.0              # Untuk request API
  crypto: ^3.0.3            # Untuk hashing (SHA256)
  # provider: ^6.0.5        # Contoh state management (aktifkan jika perlu)

  # Dependensi bawaan Flutter:
  cupertino_icons: ^1.0.2
# ------------------------------------

# --- DEV DEPENDENCIES (Untuk testing & development) ---
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linter untuk menjaga kualitas kode (direkomendasikan)
  flutter_lints: ^5.0.0 # Gunakan versi terbaru atau sesuai rekomendasi Flutter
# ----------------------------------------------------

# --- FLUTTER CONFIGURATION ---
flutter:
  # Baris berikut memastikan Material Icons font disertakan.
  uses-material-design: true

  # Untuk menambahkan assets seperti gambar:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

