# codemagic.yaml
workflows:
  android-release-workflow:
    name: Android Release Build
    max_build_duration: 60 # Optional: Set a build timeout in minutes
    instance_type: mac_mini_m1 # Or linux_x2, windows_x2 etc. based on your needs/plan

    # === Environment Variables ===
    environment:
      flutter: 3.22.2 # Or specify the exact version you use
      groups:
        - android_signing # Group for secrets related to signing
      # Add other groups if needed, e.g., for API keys:
      #  - api_keys

    # === Secrets / Encrypted Environment Variables ===
    # Define these in the Codemagic UI under App Settings > Environment variables > android_signing group:
    #    CM_KEYSTORE: Base64 encoded content of your .jks file
    #    CM_KEYSTORE_PASSWORD: Your Keystore password
    #    CM_KEY_ALIAS_PASSWORD: Your Key Alias password
    #    CM_KEY_ALIAS: Your Key Alias name (e.g., my-key-alias)

    # === Android Signing Configuration (CORRECT POSITION) ===
    # This block configures signing for the build process itself
  
